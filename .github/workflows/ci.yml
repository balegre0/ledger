name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Generated code is up to date
        run: |
          uv run poe proto
          git add --intent-to-add libs/contracts/src/ledger
          git diff --exit-code -- libs/contracts/src/ledger
      - name: Protobuf breaking changes against main
        if: github.event_name == 'pull_request'
        # Runs as the owner of the checkout, not as root: nothing root-owned lands in the workspace and git never
        # has to trust a repository owned by someone else. HOME must be writable for buf's cache directory.
        run: |
          if git cat-file -e origin/main:libs/contracts/buf.yaml 2>/dev/null; then
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo" --workdir /repo/libs/contracts bufbuild/buf:1.73.0 \
              breaking --against '/repo/.git#branch=origin/main,subdir=libs/contracts'
          fi
      - name: Format, lint, types x2, architecture, deps, spelling, tests
        run: uv run poe check
      - name: Local infrastructure configuration
        run: |
          docker compose -f deploy/local/compose.yaml config --quiet
          docker compose -f deploy/local/compose.yaml --profile zitadel config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Identity's production image
        # Built once, with its layers cached in GitHub Actions' cache (the dependencies' layer changes only with the
        # lockfile or a manifest), and loaded into Docker under the tag compose runs.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/identity/Dockerfile
          tags: ledger-identity:local
          load: true
          cache-from: type=gha,scope=identity
          cache-to: type=gha,scope=identity,mode=max
      - name: Local stack starts healthy, identity from its production image
        # From the image just built: runs the migrations (one-shot service), starts identity and waits for its
        # health check (/readyz: PostgreSQL, NATS, workers, the chassis's tables, identity's migrations); then
        # checks that the API refuses an anonymous caller, that gRPC is not published to the host (Decision 14),
        # that the image runs as nonroot and that migrating again changes nothing. Torn down on any exit.
        run: |
          compose='docker compose -p ledger-ci -f deploy/local/compose.yaml'
          trap '$compose down -v' EXIT
          $compose up -d --wait --no-build || { $compose logs; exit 1; }
          identity="http://127.0.0.1:${LEDGER_IDENTITY_PORT:-8100}"
          curl --fail --silent --show-error "$identity/readyz"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$identity/v1/companies")" = 401
          test -z "$($compose port identity 50051 2>/dev/null)"
          test "$(docker image inspect ledger-identity:local --format '{{.Config.User}}')" = nonroot
          $compose run --rm identity-migrate

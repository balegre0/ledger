name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned by the commit of its release (the tag in the comment): a re-pointed tag cannot change
# what runs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-packages
      - name: Protobuf breaking changes against the base
        # The gate's own task with an explicit base, which must name a commit: a pull request's base branch as
        # fetched (its checkout has no local branch of it, so `poe check`'s run against `main` finds nothing to
        # compare and passes), or on a push the commit the branch pointed to before (all zeros for a new branch:
        # nothing to compare). It extracts the base's contracts/ with `git archive` and runs buf breaking in the
        # image deploy/local/images.toml pins, without network, both trees mounted read-only; it passes while
        # the base holds no .proto.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "a new branch: nothing to compare"
          else
            uv run poe proto-breaking --base "$BASE"
          fi
      - name: Format, lint, types x2, architecture, deps, spelling, devtools, dead code, tests
        # The packages' test runs share the runner: LEDGER_TEST_JOBS caps how many run at once (two on a 4-core
        # runner keeps memory in bounds); each line of a run is prefixed with its package, and pytest-timeout ends
        # a test past 300 s, so a hang names itself.
        env:
          LEDGER_TEST_JOBS: "2"
        run: uv run poe check
      - name: Local infrastructure configuration
        # The signer's callers' tokens and do-ecf-v1's development roots first: compose refuses the stack without
        # the files the scripts write.
        run: |
          sh deploy/local/signer/tokens.sh
          sh deploy/local/do/roots.sh
          docker compose -f deploy/local/compose.yaml config --quiet
          docker compose -f deploy/local/compose.yaml --profile zitadel config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: The image of every app
        # Built once, with its layers cached in GitHub Actions' cache, and loaded into Docker under the tag compose
        # runs.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/docker/ledger.Dockerfile
          tags: ledger:local
          load: true
          cache-from: type=gha,scope=ledger
          cache-to: type=gha,scope=ledger,mode=max
      - name: Local stack starts healthy from the image
        # From the image just built: the migrate job runs once, the api, the worker, the receiver and the signer
        # start after it and compose waits for their health checks (/readyz: PostgreSQL, every schema at head, the
        # runners, the regimes; the signer's gRPC service and KMS). Then: the signer says it serves its module and
        # the api and the receiver that they only relay it, the API refuses an anonymous caller, the receiver serves
        # no api route, no document and no probe asked through a proxy, the api and the receiver stay ready with the signer stopped, the image runs as nonroot and holds no dev-only package,
        # and migrating again changes nothing. Torn down on any exit.
        run: |
          compose='docker compose -p ledger-ci -f deploy/local/compose.yaml'
          trap '$compose down -v' EXIT
          $compose up -d --wait --no-build || { $compose logs; exit 1; }
          api="http://127.0.0.1:${LEDGER_API_PORT:-8100}"
          worker="http://127.0.0.1:${LEDGER_WORKER_PORT:-8101}"
          curl --fail --silent --show-error "$api/readyz"
          curl --fail --silent --show-error "$worker/readyz"
          receiver="http://127.0.0.1:${LEDGER_RECEIVER_PORT:-8103}"
          curl --fail --silent --show-error "$receiver/readyz"
          signer="http://127.0.0.1:${LEDGER_SIGNER_PORT:-8102}"
          curl --fail --silent --show-error "$signer/readyz"
          served='ledger_isolated_module_served{isolated_in="signer",module="signer"}'
          curl --fail --silent --show-error "$signer/metrics" | grep -qxF "$served 1.0"
          curl --fail --silent --show-error "$api/metrics" | grep -qxF "$served 0.0"
          curl --fail --silent --show-error "$receiver/metrics" | grep -qxF "$served 0.0"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$api/v1/companies")" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$receiver/v1/companies")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$receiver/openapi.json")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Forwarded-For: 192.0.2.1' "$receiver/readyz")" = 404
          test "$(docker image inspect ledger:local --format '{{.Config.User}}')" = nonroot
          test "$(docker run --rm --entrypoint /app/.venv/bin/python ledger:local -c             'import importlib.util as u; print(any(u.find_spec(m) for m in ("ledger_testing", "ledger_devtools", "ledger_country_do_testing", "pytest")))')" = False
          $compose run --rm migrate || { $compose logs migrate; exit 1; }
          $compose stop signer
          curl --fail --silent --show-error "$api/readyz"
          curl --fail --silent --show-error "$receiver/readyz"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Generated code is up to date
        run: |
          uv run poe proto
          git add --intent-to-add contracts/src/ledger
          git diff --exit-code -- contracts/src/ledger
      - name: Protobuf breaking changes against main
        if: github.event_name == 'pull_request'
        # Runs as the owner of the checkout, not as root: nothing root-owned lands in the workspace and git never
        # has to trust a repository owned by someone else. HOME must be writable for buf's cache directory.
        run: |
          if git cat-file -e origin/main:contracts/buf.yaml 2>/dev/null; then
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo" --workdir /repo/contracts bufbuild/buf:1.73.0@sha256:75d8f756f0919dcded71e67968a91adfe55fe4dd62c4900c57bbfcd7fe625608 \
              breaking --against '/repo/.git#branch=origin/main,subdir=contracts'
          fi
      - name: Format, lint, types x2, architecture, deps, spelling, tests
        run: uv run poe check
      - name: Local infrastructure configuration
        run: |
          docker compose -f deploy/local/compose.yaml config --quiet
          docker compose -f deploy/local/compose.yaml --profile zitadel config --quiet

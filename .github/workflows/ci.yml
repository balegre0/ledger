name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-packages
      - name: Protobuf breaking changes against main
        # Only once contracts/proto holds a .proto (the signer milestone adds the first). Runs as the owner of the
        # checkout, not as root: nothing root-owned lands in the workspace and git never has to trust a
        # repository owned by someone else. HOME must be writable for buf's cache directory. The image is the
        # one deploy/local/images.toml pins.
        if: github.event_name == 'pull_request' && hashFiles('contracts/proto/**/*.proto') != ''
        run: |
          buf_image="$(uv run python -c 'import tomllib; print(tomllib.load(open("deploy/local/images.toml", "rb"))["images"]["buf"])')"
          if git cat-file -e origin/main:contracts/buf.yaml 2>/dev/null; then
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo" --workdir /repo/contracts "$buf_image" \
              breaking --against '/repo/.git#branch=origin/main,subdir=contracts'
          fi
      - name: Format, lint, types x2, architecture, deps, spelling, devtools, dead code, tests
        # The packages' test runs share the runner: LEDGER_TEST_JOBS caps how many run at once (two on a 4-core
        # runner keeps memory in bounds); each line of a run is prefixed with its package, and pytest-timeout ends
        # a test past 300 s, so a hang names itself.
        env:
          LEDGER_TEST_JOBS: "2"
        run: uv run poe check
      - name: Local infrastructure configuration
        run: |
          docker compose -f deploy/local/compose.yaml config --quiet
          docker compose -f deploy/local/compose.yaml --profile zitadel config --quiet

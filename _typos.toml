[files]
extend-exclude = [
    "uv.lock",
    "countries/do/src/ledger_country_do/channels/ecf_v1/adapters/xsd/",
    "countries/do/tests/contract/golden/",
    # protoc's output (ledger_devtools.protos): serialized descriptors, spelled by the contract, not here.
    "modules/*/src/*/adapters/grpc/_generated/",
    # The program ledgers quote the owner and DGII verbatim, in Spanish, and carry words such as CHECK in capitals.
    "docs/handoff/PROGRAM.md",
    "docs/handoff/DECISION-LEDGER-*.md",
]

[default]
# Ruff rule codes (`CPY001` in the root pyproject.toml) are identifiers, not words.
extend-ignore-identifiers-re = ["^CPY[0-9]{3}$"]

[default.extend-words]
# The Python package of Mozilla's CA bundle, which httpx verifies TLS against.
certifi = "certifi"
# Spanish: a DGII e-invoice status ("Aceptado Condicional"), not an English typo.
condicional = "condicional"
# Spanish: DGII's own words (element names, document titles, sample addresses) its files and the DO pack quote.
calle = "calle"
cliente = "cliente"
comercial = "comercial"
descripcion = "descripcion"
direccion = "direccion"
emision = "emision"
excede = "excede"
informacion = "informacion"
informe = "informe"
instructivo = "instructivo"
limite = "limite"
modificacion = "modificacion"
# Spanish quoted from Alegra's own page in the 2026-10-25 architecture review.
utiliza = "utiliza"
# Abbreviations and names the 2026-10-25 architecture review uses: small and medium enterprise, recovery time
# objective, GAE Digital (an e-CF gateway), Matthew Skelton (co-author of Team Topologies).
SME = "SME"
RTO = "RTO"
GAE = "GAE"
Skelton = "Skelton"

[default.extend-identifiers]
# ISO 3166-1 and ISO 4217 codes the kernel lists (Bosnia, the Faroe Islands, Pitcairn; the Jordanian dinar).
BA = "BA"
FO = "FO"
PN = "PN"
JOD = "JOD"

[project]
name = "ledger-identity"
version = "0.1.0"
description = "Organizations, companies, their branches and emission points, memberships and roles."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-platform",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
]

[project.entry-points."ledger.modules"]
identity = "ledger_identity.assembly:MODULE"

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

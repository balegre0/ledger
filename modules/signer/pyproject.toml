# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-signer"
version = "0.1.0"
description = "Signing certificates in custody, and every signature made with them, in a process of their own."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-platform",
    "ledger-fiscal-kit",
    "ledger-identity",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "grpcio>=1.84.0",
    "prometheus-client>=0.26.0",
    "protobuf>=7.36.2",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[project.entry-points."ledger.modules"]
signer = "ledger_signer.assembly:MODULE"

[project.entry-points."ledger.settings"]
signer = "ledger_signer.assembly:MODULE"

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }
ledger-fiscal-kit = { workspace = true }
ledger-identity = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_signer"]
source = ["modules/signer/src/ledger_signer/adapters/postgres/migrations"]
omit = ["*/modules/*/src/*/adapters/grpc/_generated/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

[tool.deptry.package_module_name_map]
"grpcio" = "grpc"
"protobuf" = "google"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "ledger-identity",
]

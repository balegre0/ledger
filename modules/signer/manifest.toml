[package]
name = "signer"
kind = "module"
summary = "Signing certificates in custody, and every signature made with them, in a process of their own."
owners = ["@balegre0"]
settings = true                      # LEDGER_SIGNER_*

[dependencies]
packages = ["kernel", "platform", "fiscal-kit"]
modules = ["identity"]               # its events (company deactivations); its API in api (who may do what)
python = ["alembic>=1.20.0", "cryptography>=50.0.2", "fastapi>=0.143.0", "grpcio>=1.84.0",
          "prometheus-client>=0.26.0", "protobuf>=7.36.2", "psycopg>=3.3.6", "pydantic>=2.14.1",
          "pydantic-settings>=2.15.0", "sqlalchemy>=2.1.4", "starlette>=1.7.0"]
test = ["signxml>=5.1.0", "types-protobuf>=7.35.1.20260906"]

[data]
schema = "signer"
isolated_in = "signer"

[[ids]]
prefix = "crt"
resource = "certificate"

[[permissions]]
code = "signer.certificates.read"
summary = "See the company's signing certificates: their holder, issuer, validity and status."
roles = ["owner", "admin", "accountant", "issuer", "viewer"]

[[permissions]]
code = "signer.certificates.manage"
summary = "Install and retire the company's signing certificates."
roles = ["owner", "admin"]

[[events.publishes]]
type = "signer.certificate.installed"
version = 1

[[events.publishes]]
type = "signer.certificate.retired"
version = 1

[[events.publishes]]
type = "signer.certificate.expiring"
version = 1
public = "certificate.expiring"

[[events.consumes]]
consumer = "signer.company_deactivations"
types = ["identity.company.deactivated"]

[[jobs]]
kind = "signer.expiry_notice"
max_attempts = 20

[[jobs]]
kind = "signer.purge_idempotency_keys"
concurrency = 1

[[jobs]]
kind = "signer.purge_done_jobs"
concurrency = 1

[[schedules]]
name = "signer.purge_idempotency_keys"
every = "1h"
enqueues = "signer.purge_idempotency_keys"

[[schedules]]
name = "signer.purge_done_jobs"
every = "24h"
enqueues = "signer.purge_done_jobs"

[extension_points]
provides = ["SignerPort"]            # fiscal-kit's, to channels

[http]
mounted_in = ["api"]
prefixes = ["/v1/certificates"]

[package]
name = "invoicing"
kind = "module"
summary = "Commercial documents: invoices, credit and debit notes, their lines and totals."
owners = ["@balegre0"]

[dependencies]
packages = ["kernel", "platform"]
modules = ["identity"]
python = ["alembic>=1.20.0", "pydantic>=2.14.1", "sqlalchemy>=2.1.4"]

[data]
schema = "invoicing"

[[ids]]
prefix = "inv"
resource = "invoice"

[[permissions]]
code = "invoicing.invoices.read"
summary = "Read commercial documents and their fiscal status."
roles = ["owner", "admin", "accountant", "issuer", "viewer"]

[[permissions]]
code = "invoicing.invoices.create"
summary = "Create invoices, credit notes and debit notes, as drafts or issued."
roles = ["owner", "admin", "accountant", "issuer"]

[[permissions]]
code = "invoicing.invoices.issue"
summary = "Issue a draft."
roles = ["owner", "admin", "accountant", "issuer"]

[[permissions]]
code = "invoicing.invoices.void"
summary = "Void an issued document no channel accepted."
roles = ["owner", "admin", "accountant"]

[[events.publishes]]
type = "invoicing.invoice.issued"
version = 1

[[events.publishes]]
type = "invoicing.invoice.voided"
version = 1

[http]
mounted_in = ["api"]
prefixes = ["/v1/invoices"]

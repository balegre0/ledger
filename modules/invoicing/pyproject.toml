# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-invoicing"
version = "0.1.0"
description = "Commercial documents: invoices, credit and debit notes, their lines and totals."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-platform",
    "ledger-identity",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
]

[project.entry-points."ledger.modules"]
invoicing = "ledger_invoicing.assembly:MODULE"

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }
ledger-identity = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_invoicing"]
source = ["modules/invoicing/src/ledger_invoicing/adapters/postgres/migrations"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

[tool.deptry.per_rule_ignores]
DEP002 = [
    "ledger-identity",
]

# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-country-do-testing"
version = "0.1.0"
description = "Dev-only tools of the DO pack: a fake DGII from DGII's documentation, a test PKI, samples, the spike CLI."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-country-do",
    "cryptography>=50.0.2",
    "granian>=2.8.4",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "signxml>=5.1.0",
    "starlette>=1.7.0",
    "testcontainers>=4.15.0",
    "xmlschema>=4.3.2",
]

[project.scripts]
ledger-dgii-spike = "ledger_country_do_testing.spike:main"
ledger-fake-dgii = "ledger_country_do_testing.fake_dgii.serve:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_country_do_testing"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

[tool.deptry.package_module_name_map]
"python-multipart" = [
    "multipart",
    "python_multipart",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "python-multipart",
]

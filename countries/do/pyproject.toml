# Hand-written until `ledger-devtools sync` generates it from countries/do/manifest.toml (Task 19): keep the
# two in step (tests/unit/test_regime.py compares the regime's entry point).
[project]
name = "ledger-country-do"
version = "0.1.0"
description = "Dominican Republic: regime 'do' (DGII's tax law as data) and channel 'do-ecf-v1' (e-CF)."
requires-python = ">=3.15"
dependencies = ["ledger-kernel", "cryptography>=50.0.2", "httpx>=0.28.1", "lxml>=6.1.3", "pydantic>=2.14.1"]

[project.entry-points."ledger.countries.regimes"]
do = "ledger_country_do.regime:REGIME"

[tool.uv.sources]
ledger-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

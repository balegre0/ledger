[project]
name = "ledger-country-do"
version = "0.1.0"
description = "Dominican Republic: regime 'do' (DGII's tax law as data) and channel 'do-ecf-v1' (e-CF)."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-platform",
    "ledger-fiscal-kit",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "reportlab>=5.1.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.4",
]

[project.entry-points."ledger.countries.regimes"]

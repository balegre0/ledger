[package]
name = "do"
kind = "country"
summary = "Dominican Republic: regime 'do' (DGII's tax law as data) and channel 'do-ecf-v1' (e-CF)."
owners = ["@balegre0"]

# The regime is the kernel's data alone (import-linter keeps it pure); the channel's adapters read XML with
# fiscal-kit's hardened reader and verify its signature profile, and sign through its SignerPort (whose calls
# are the platform's SystemCall). Without a channel entry the pack gets no generated _manifest.py (whose model
# is the platform's) until a channel (v2-M3) brings one.
[dependencies]
packages = ["kernel", "platform", "fiscal-kit"]
python = ["cryptography>=50.0.2", "httpx>=0.28.1", "lxml>=6.1.3", "pydantic>=2.14.1"]
test = ["signxml>=5.1.0", "types-lxml>=2026.2.16", "xmlschema>=4.3.2"]

[country]
iso = "DO"
name = "Dominican Republic"
currencies = ["DOP"]
time_zone = "America/Santo_Domingo"
authority = { name = "Dirección General de Impuestos Internos", short = "DGII", url = "https://dgii.gov.do" }

# The channel do-ecf-v1 is a library until it has an assembly and a schema (v2-M3): no [[channels]] entry yet.
[[regimes]]
key = "do"
entry_point = "ledger_country_do.regime:REGIME"

[package]
name = "do"
kind = "country"
summary = "Dominican Republic: regime 'do' (DGII's tax law as data) and channel 'do-ecf-v1' (e-CF)."
owners = ["@balegre0"]

# The regime is the kernel's data alone (import-linter keeps it pure); the channel's adapters read XML with
# fiscal-kit's hardened reader and verify its signature profile, and sign through its SignerPort (whose calls
# are the platform's SystemCall). Without a channel entry the pack gets no generated _manifest.py (whose model
# is the platform's) until a channel (v2-M3) brings one. The printed representation is drawn with reportlab
# (BSD) and its QR encoded with segno (BSD) (Decision 26); its tests read the PDF back with pypdf (BSD) and
# decode the QR with zxing-cpp (Apache-2.0).
[dependencies]
packages = ["kernel", "platform", "fiscal-kit"]
python = ["alembic>=1.20.0", "cryptography>=50.0.2", "fastapi>=0.143.0", "httpx>=0.28.1", "lxml>=6.1.3",
          "psycopg>=3.3.6", "pydantic>=2.14.1", "pydantic-settings>=2.15.0", "reportlab>=5.1.0", "segno>=1.6.6",
          "sqlalchemy>=2.1.4"]
test = ["pypdf>=6.21.2", "signxml>=5.1.0", "types-lxml>=2026.2.16", "types-reportlab>=5.0.0.20261008",
        "xmlschema>=4.3.2", "zxing-cpp>=3.1.1"]

[country]
iso = "DO"
name = "Dominican Republic"
currencies = ["DOP"]
time_zone = "America/Santo_Domingo"
authority = { name = "Dirección General de Impuestos Internos", short = "DGII", url = "https://dgii.gov.do" }

[[regimes]]
key = "do"
entry_point = "ledger_country_do.regime:REGIME"

# Channel do-ecf-v1 (spec §4.3, §8.6): DGII's e-CF. Its jobs, schedules and consumers are declared by the tasks
# that hand their handlers (an assembly must provide each one its entry declares).
[[channels]]
key = "do-ecf-v1"
entry_point = "ledger_country_do.channels.ecf_v1.assembly:CHANNEL"
schema = "do_ecf"
valid_from = "2019-01-01"
environments = ["testecf", "certecf", "ecf"]
live_environments = ["ecf"]
document_kinds = ["invoice", "credit_note", "debit_note"]
directions = ["sales", "purchase"]
http_prefixes = ["/v1/do"]
tier = "bronze"
settings = true                      # LEDGER_DO_ECF_*

[[channels.ids]]
prefix = "rng"
resource = "numbering_range"

[[channels.ids]]
prefix = "anl"
resource = "range_void"

[[channels.ids]]
prefix = "rdoc"
resource = "received_document"

[[channels.permissions]]
code = "do_ecf.ranges.read"
summary = "See the company's DGII-authorized e-NCF ranges."
roles = ["owner", "admin", "accountant", "issuer", "viewer"]

[[channels.permissions]]
code = "do_ecf.ranges.manage"
summary = "Register DGII-authorized e-NCF ranges."
roles = ["owner", "admin"]

[[channels.permissions]]
code = "do_ecf.ranges.void"
summary = "Void unused e-NCF before DGII."
roles = ["owner", "admin"]

[[channels.permissions]]
code = "do_ecf.received_documents.read"
summary = "See the e-CF other emitters sent the company."
roles = ["owner", "admin", "accountant", "viewer"]

[[channels.permissions]]
code = "do_ecf.received_documents.manage"
summary = "Approve or reject received e-CF commercially."
roles = ["owner", "admin", "accountant"]

[[channels.permissions]]
code = "do_ecf.deliveries.manage"
summary = "Retry a delivery to a buyer; choose whether to authenticate with buyers."
roles = ["owner", "admin", "accountant"]

[[channels.events.publishes]]
type = "fiscal_channel.document.updated"
version = 1

[[channels.events.publishes]]
type = "fiscal_channel.received_document.recorded"
version = 1
public = "received_document.created"

[[channels.events.publishes]]
type = "fiscal_channel.requirements.changed"
version = 1

# A numbered document's way to DGII: signed (Task 18's step), then submitted and polled (Task 19's).
[[channels.jobs]]
kind = "do_ecf.advance"
timeout = "3m"                       # one outbound call per run (Decision 10)
max_attempts = 50                    # failures; RunAgain does not count
deadline = "15d"
concurrency = 16

# An accepted e-CF's way to its buyer (spec §8.6.5, Decision 21): its handler records `failed` at seven days
# from the start of the delivery and never schedules a run past them, so its deadline leaves a day's room for
# that last run (a dead job would record nothing a client could see).
[[channels.jobs]]
kind = "do_ecf.deliver"
timeout = "3m"                       # one buyer exchange per run (the buyer client's own deadline is 60 s)
max_attempts = 50                    # failures; RunAgain does not count
deadline = "8d"
concurrency = 8

# A received e-CF's commercial approval or rejection, as the company decided it (spec §8.6.5 step 6, Task 23):
# its ACECF signed once, archived, then sent to the emitter and to DGII; like a delivery, the emitter is tried
# for seven days from the decision (Decision 21), so its deadline leaves a day's room for the run that records
# the failure.
[[channels.jobs]]
kind = "do_ecf.approve"
timeout = "3m"                       # one signature and at most one call to each party per run
max_attempts = 50                    # failures; RunAgain does not count
deadline = "8d"
concurrency = 4

[[channels.jobs]]
kind = "do_ecf.purge_receiver_credentials"   # the receiver's expired seeds and tokens (Task 22)
concurrency = 1

[[channels.schedules]]
name = "do_ecf.purge_receiver_credentials"
every = "1h"
enqueues = "do_ecf.purge_receiver_credentials"

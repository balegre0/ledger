[project]
name = "ledger-devtools"
version = "0.1.0"
description = "Generates and checks what the manifests imply: pyproject files, manifest modules, contracts."
requires-python = ">=3.15"
dependencies = ["ledger-kernel", "ledger-platform", "pydantic>=2.14.1"]

[project.scripts]
ledger-devtools = "ledger_devtools.cli:main"

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


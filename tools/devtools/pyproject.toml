# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-devtools"
version = "0.1.0"
description = "Generates and checks what the manifests imply."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "ledger-platform",
    "pathspec>=1.1.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
ledger-devtools = "ledger_devtools.cli:main"

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_devtools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

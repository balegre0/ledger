# Every container image the repository runs, pinned once. ledger_testing reads these values; compose.yaml and the
# Dockerfiles name the same strings, and `ledger-devtools check` fails when they differ or a pin lacks its digest
# (the tag's multi-platform index: `docker buildx imagetools inspect <tag>`).
[images]
postgres = "postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
zitadel = "ghcr.io/zitadel/zitadel:v4.19.2@sha256:956a298405189a8f6cd4ec92e8828b1bd10caa7da8b139c39d251d7053e33784"
uv = "ghcr.io/astral-sh/uv:0.13.0-trixie-slim@sha256:11bee95ce27982f00acb0c85aa1b5ee6203a9bb958b7def6f27ead851d454e8d"
distroless = "gcr.io/distroless/cc-debian13:nonroot@sha256:e792ab3d241a468a4fd7519ddbbebe66b49b5f365771716ea688ad40b6c6f1c2"
# S3 with object lock for the S3 store's tests and the local stack's profile `localstack` (v2-M3b Task 16). The last
# release that starts without an auth token: later images require one (Owner item 4).
localstack = "localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a"
buf = "bufbuild/buf:1.73.0@sha256:75d8f756f0919dcded71e67968a91adfe55fe4dd62c4900c57bbfcd7fe625608"
# The base of the xmlsec1 image the DO pack's signature tests build (countries/do/testing/.../xmlsec1/Dockerfile).
xmlsec1-base = "debian:trixie-20260918-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"

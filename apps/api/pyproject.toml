[project]
name = "ledger-app-api"
version = "0.1.0"
description = "The public API: every module's routers."
requires-python = ">=3.15"
dependencies = [
    "ledger-platform",
    "fastapi>=0.143.0",
    "granian[uvloop]>=2.8.4",
]

[project.scripts]
ledger-api = "ledger_app_api.main:main"

[tool.uv.sources]
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

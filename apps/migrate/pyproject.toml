[project]
name = "ledger-app-migrate"
version = "0.1.0"
description = "Every schema's migrations, subscriptions and routing, before a rollout."
requires-python = ">=3.15"
dependencies = ["ledger-platform"]

[project.scripts]
ledger-migrate = "ledger_app_migrate.main:main"

[tool.uv.sources]
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

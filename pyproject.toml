[project]
name = "ledger-workspace"
version = "0.0.0"
description = "Workspace root: the shared tooling of every ledger package and service."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel", "ledger-platform", "ledger-identity", "ledger-country-do", "ledger-app-api", "ledger-app-worker",
    "ledger-app-migrate",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "ledger-country-do-testing",
    "ledger-devtools",
    "ledger-testing",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "signxml>=5.1.0",
    "testcontainers>=4.15.0",
    "types-grpcio>=1.84.0.20260928",
    "types-lxml>=2026.2.16",
    "typos>=1.51.1",
    "xmlschema>=4.3.2",
]

[tool.uv]
required-version = ">=0.13.0"
package = false
constraint-dependencies = ["cryptography>=50.0.2"]  # joserfc's: the first release with CPython 3.15 wheels of its own

[tool.uv.workspace]
members = ["packages/*", "modules/*", "tools/*", "countries/do", "countries/do/testing", "apps/*"]

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }
ledger-testing = { workspace = true }
ledger-identity = { workspace = true }
ledger-devtools = { workspace = true }
ledger-country-do = { workspace = true }
ledger-country-do-testing = { workspace = true }
ledger-app-api = { workspace = true }
ledger-app-worker = { workspace = true }
ledger-app-migrate = { workspace = true }

# ── Tasks: `uv run poe <task>` ──────────────────────────────────────────────────
[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix .", help = "Format and autofix" }
format-check = { cmd = "ruff format --check .", help = "Verify formatting" }
lint = { cmd = "ruff check .", help = "Lint (every ruff rule enabled)" }
pyright = { cmd = "basedpyright", help = "Type check #1: basedpyright, mode 'all'" }
mypy-kernel = { cmd = "mypy packages/kernel" }
mypy-platform = { cmd = "mypy packages/platform" }
mypy-testing = { cmd = "mypy packages/testing" }
mypy-identity = { cmd = "mypy modules/identity" }
mypy-devtools = { cmd = "mypy tools/devtools" }
mypy-country-do = { cmd = "mypy countries/do/src countries/do/tests" }
mypy-country-do-testing = { cmd = "mypy countries/do/testing" }
mypy-app-api = { cmd = "mypy apps/api" }
mypy-app-worker = { cmd = "mypy apps/worker" }
mypy-app-migrate = { cmd = "mypy apps/migrate" }
mypy-workspace = { cmd = "mypy tests" }
mypy = { sequence = ["mypy-kernel", "mypy-platform", "mypy-testing", "mypy-identity", "mypy-devtools", "mypy-country-do", "mypy-country-do-testing", "mypy-app-api", "mypy-app-worker", "mypy-app-migrate", "mypy-workspace"], help = "Type check #2, one package at a time (each has its own tests), then the workspace's own tests" }
types = { sequence = ["pyright", "mypy"], help = "Both type checkers" }
arch = { cmd = "lint-imports", help = "Architecture contracts (import-linter)" }
deps-kernel = { cmd = "deptry packages/kernel/src --config packages/kernel/pyproject.toml" }
deps-platform = { cmd = "deptry packages/platform/src --config packages/platform/pyproject.toml" }
deps-testing = { cmd = "deptry packages/testing/src --config packages/testing/pyproject.toml" }
deps-identity = { cmd = "deptry modules/identity/src --config modules/identity/pyproject.toml" }
deps-devtools = { cmd = "deptry tools/devtools/src --config tools/devtools/pyproject.toml" }
deps-country-do = { cmd = "deptry countries/do/src --config countries/do/pyproject.toml" }
deps-country-do-testing = { cmd = "deptry countries/do/testing/src --config countries/do/testing/pyproject.toml" }
deps-app-api = { cmd = "deptry apps/api/src --config apps/api/pyproject.toml" }
deps-app-worker = { cmd = "deptry apps/worker/src --config apps/worker/pyproject.toml" }
deps-app-migrate = { cmd = "deptry apps/migrate/src --config apps/migrate/pyproject.toml" }
deps = { sequence = ["deps-kernel", "deps-platform", "deps-testing", "deps-identity", "deps-devtools", "deps-country-do", "deps-country-do-testing", "deps-app-api", "deps-app-worker", "deps-app-migrate"], help = "Unused / missing / transitive dependencies, per package" }
spell = { cmd = "typos", help = "Spell check" }
test = { cmd = "pytest -n auto", help = "Tests with coverage, in parallel" }
openapi = { cmd = "pytest modules/identity/tests/contract --no-cov -q -p no:randomly", env = { UPDATE_SNAPSHOTS = "1" }, help = "Rewrite the published OpenAPI documents (the snapshot test writes them, then fails: review the diff)" }
check = { sequence = ["format-check", "lint", "suppressions", "types", "arch", "deps", "spell", "proto-lint", "test"], help = "Everything CI runs" }

# buf lint over contracts/, in the image deploy/local/images.toml pins. Skipped while no .proto exists: the signer
# milestone adds the first (the only cross-process surface; in-process APIs are Python Protocols).
[tool.poe.tasks.proto-lint]
help = "buf lint over contracts/ (skipped while no .proto exists)"
imports = ["glob", "os", "pathlib", "subprocess", "tomllib"]
assert = true
expr = '''
not glob.glob("contracts/proto/**/*.proto", recursive=True) or subprocess.run([
    "docker", "run", "--rm", "--volume", f"{os.getcwd()}/contracts:/workspace", "--workdir", "/workspace",
    tomllib.loads(pathlib.Path("deploy/local/images.toml").read_text(encoding="utf-8"))["images"]["buf"], "lint",
]).returncode == 0
'''

# Zero suppressions: no Python file may switch a check off.
# `git grep` runs once with one `-e` pattern per banned form (patterns are OR-ed, matched in any case), in
# this order:
#   1. `# noqa`                              ruff, one line
#   2. `# type: ignore`                      mypy and (base)pyright, one line
#   3. `# pyright:` / `# basedpyright:`      ignore, basic, strict, rule switches
#   4. `# flake8:` `# isort:` `# mypy:` `# ruff:`
#                                            whole-file forms (`# flake8: noqa`, `# ruff: noqa`,
#                                            `# mypy: ignore-errors`, `# isort: skip_file`) and ruff's
#                                            `# ruff: disable[...]` ranges
#   5. `# pragma: no cover` / `no branch`    coverage (also switched off in [tool.coverage.report])
# `git grep` exits 1 when nothing matches, so the task passes on exactly 1: a match (0) or a git failure (128)
# fails it. Untracked files are searched too, so a new file is checked before its first `git add`. Runs the
# same on Windows and Linux: no shell, no script. Prose that mentions a form without the `#` is not a match.
[tool.poe.tasks.suppressions]
help = "Zero suppressions: no noqa, type: ignore, tool directive or coverage pragma in Python files"
imports = ["subprocess"]
assert = true
expr = '''
subprocess.run([
    "git", "grep", "--untracked", "--exclude-standard", "--line-number", "--ignore-case", "--extended-regexp",
    "-e", "#[[:space:]]*noqa",
    "-e", "#[[:space:]]*type:[[:space:]]*ignore",
    "-e", "#[[:space:]]*(based)?pyright:",
    "-e", "#[[:space:]]*(flake8|isort|mypy|ruff):",
    "-e", "#[[:space:]]*pragma:?[[:space:]]*no[[:space:]]*(cover|branch)",
    "--", "*.py", "*.pyi",
]).returncode == 1
'''

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py315"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header
    "D105",    # magic methods are self-documenting
    "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"{packages/*/tests,modules/*/tests,tools/*/tests,countries/do/tests,countries/do/testing/tests,apps/*/tests,tests}/**" = [
    "S101",    # assert is the point of a test
    "D",       # test names are the documentation
    "PLR2004", # magic values are fine in assertions
    "S105",    # fake credentials are not secrets
    "S106",
    "S603",    # a test may run this interpreter on code of its own
    "INP001",  # tests are not a package: each package's tests/ is its own root
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    # SQLAlchemy reads the annotations of its tables at runtime
    "ledger_identity.adapters.postgres.tables.IdentityTable",
]

[tool.ruff.lint.isort]
known-first-party = [
    "ledger_kernel", "ledger_platform", "ledger_testing", "ledger_identity", "ledger_devtools", "ledger_country_do",
    "ledger_country_do_testing", "ledger_app_api", "ledger_app_worker", "ledger_app_migrate",
]

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]  # ruff 0.17 formats Python blocks inside Markdown; the docs show code as the plan wrote it

# ── Type checker #1: basedpyright ───────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.15"
include = ["packages", "modules", "tools", "countries", "apps", "tests"]
exclude = ["**/.venv", "**/__pycache__"]
typeCheckingMode = "all"
failOnWarnings = true
reportImplicitOverride = "error"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"

# ── Type checker #2: mypy --strict + every opt-in error code that applies ──────
[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
extra_checks = true
local_partial_types = true
strict_bytes = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Tests ───────────────────────────────────────────────────────────────────────
[tool.pytest]
minversion = "9.0"
testpaths = ["packages", "modules", "tools", "countries", "apps", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = [
    "ledger_kernel", "ledger_platform", "ledger_testing", "ledger_identity", "ledger_devtools", "ledger_country_do",
    "ledger_country_do_testing", "ledger_app_api", "ledger_app_worker", "ledger_app_migrate",
]
# Alembic runs a service's migration environment and scripts from their files, as modules named after the file
# (`env_py`), outside the service's package: coverage, which picks `source_pkgs` by module name, would never
# trace them. Their directory is named here, which coverage matches by path.
source = [
    "modules/identity/src/ledger_identity/adapters/postgres/migrations",
    "packages/platform/src/ledger_platform/data/revisions",
]
# sys.monitoring, not the C tracer: lines of a route that run after SQLAlchemy's asynchronous driver switched
# greenlets are reported unexecuted by the C tracer although they ran; sys.monitoring sees them.
core = "sysmon"

[tool.coverage.report]
fail_under = 100
exclude_lines = []     # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

# ── Architecture contracts (import-linter) ──────────────────────────────────────
[tool.importlinter]
root_packages = [
    "ledger_kernel", "ledger_platform", "ledger_testing", "ledger_identity", "ledger_devtools", "ledger_country_do",
    "ledger_country_do_testing", "ledger_app_api", "ledger_app_worker", "ledger_app_migrate",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Production code never imports test tooling"
type = "forbidden"
source_modules = [
    "ledger_kernel", "ledger_platform", "ledger_identity", "ledger_country_do", "ledger_app_api", "ledger_app_worker",
    "ledger_app_migrate",
]
forbidden_modules = [
    "pytest", "hypothesis", "testcontainers", "ledger_testing", "ledger_country_do_testing", "signxml", "xmlschema",
]

[[tool.importlinter.contracts]]
name = "Packages point down: platform -> kernel"
type = "layers"
layers = ["ledger_platform", "ledger_kernel"]

# Inside the platform, top to bottom (§5.2). Subpackages are layers and peers (`|`) never import each other; the
# runtime, the composition root, imports every layer below it. Exhaustive: a module without a layer is an error.
[[tool.importlinter.contracts]]
name = "Platform layers"
type = "layers"
containers = ["ledger_platform"]
exhaustive = true
layers = ["runtime", "http | grpc", "events | jobs", "auth", "data", "observability", "_manifest", "config"]

[[tool.importlinter.contracts]]
name = "Kernel is standard library only"
type = "forbidden"
source_modules = ["ledger_kernel"]
forbidden_modules = ["pydantic", "pydantic_settings", "sqlalchemy", "fastapi", "starlette", "structlog", "google", "grpc", "opentelemetry", "prometheus_client", "psycopg"]

# An app is a composition root (§3.3): it builds an App and serves it. Modules are found through their entry
# points, so an app never imports one; nor does it reach below the platform's runtime.
[[tool.importlinter.contracts]]
name = "Apps only compose"
type = "forbidden"
source_modules = ["ledger_app_api", "ledger_app_worker", "ledger_app_migrate"]
forbidden_modules = [
    "ledger_identity.domain", "ledger_identity.application", "ledger_identity.adapters",
    "ledger_platform.config", "ledger_platform.observability", "ledger_platform.data", "ledger_platform.auth",
    "ledger_platform.events", "ledger_platform.jobs", "ledger_platform.http", "ledger_platform.grpc",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Libraries never import services"
type = "forbidden"
source_modules = ["ledger_kernel", "ledger_platform", "ledger_testing"]
forbidden_modules = ["ledger_identity"]

# Inside identity (§4.1): the assembly over the adapters (its REST API may use its PostgreSQL adapter), over the
# use cases (application), over the domain, over its events, over its generated manifest. Exhaustive: a module
# without a layer is an error.
[[tool.importlinter.contracts]]
name = "identity layers"
type = "layers"
containers = ["ledger_identity"]
exhaustive = true
layers = ["assembly", "adapters", "application", "domain", "events", "_manifest"]

# The application's ports are its own: it knows no platform type either.
[[tool.importlinter.contracts]]
name = "identity domain, events and use cases are pure"
type = "forbidden"
source_modules = ["ledger_identity.domain", "ledger_identity.events", "ledger_identity.application"]
forbidden_modules = [
    "ledger_platform",
    # the kernel contract's list ...
    "pydantic", "pydantic_settings", "sqlalchemy", "fastapi", "starlette", "structlog", "google", "grpc",
    "opentelemetry", "prometheus_client", "psycopg",
    # ... and every other dependency the packages of this repository bring in
    "httpx", "joserfc", "cryptography", "alembic", "granian",
]

# ── The Dominican pack (the v2-M1b spike) ───────────────────────────────────────
# It stands alone so the restructure can move libs/ and services/ at any time; the integration milestone takes
# the kernel off the first contract's list.
[[tool.importlinter.contracts]]
name = "The DO pack imports nothing of the workspace"
type = "forbidden"
source_modules = ["ledger_country_do", "ledger_country_do_testing"]
forbidden_modules = [
    "ledger_kernel", "ledger_platform", "ledger_identity", "ledger_testing", "ledger_devtools",
]

# Starlette is production code for the platform and identity, and test tooling (the fake DGII's) for the DO
# pack: hence a contract of the pack's own rather than an entry in "Production code never imports test tooling".
[[tool.importlinter.contracts]]
name = "The DO pack's production code never imports the fake DGII's web framework"
type = "forbidden"
source_modules = ["ledger_country_do"]
forbidden_modules = ["starlette"]

[[tool.importlinter.contracts]]
name = "The DO regime is pure data: the standard library only"
type = "forbidden"
source_modules = ["ledger_country_do.regime"]
forbidden_modules = ["ledger_country_do.channels", "lxml", "httpx", "pydantic", "cryptography"]

[[tool.importlinter.contracts]]
name = "Channel do-ecf-v1 is layered: adapters -> application -> domain"
type = "layers"
containers = ["ledger_country_do.channels.ecf_v1"]
exhaustive = true
layers = ["adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "do-ecf-v1's domain and use cases know no third party"
type = "forbidden"
source_modules = ["ledger_country_do.channels.ecf_v1.domain", "ledger_country_do.channels.ecf_v1.application"]
forbidden_modules = ["lxml", "httpx", "pydantic", "cryptography"]

[project]
name = "ledger-workspace"
version = "0.0.0"
description = "Workspace root: the shared tooling of every ledger package and service."
requires-python = ">=3.15"
dependencies = ["ledger-kernel", "ledger-contracts", "ledger-platform", "ledger-identity"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "ledger-testing",
    "mypy>=2.4.0",
    "mypy-protobuf>=5.1.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.0",
    "testcontainers>=4.15.0",
    "types-grpcio>=1.84.0.20260928",
    "types-protobuf>=7.35.1.20260906",
    "typos>=1.51.1",
]

[tool.uv]
required-version = ">=0.13.0"
package = false
constraint-dependencies = ["cryptography>=50.0.2"]  # joserfc's: the first release with CPython 3.15 wheels of its own

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
ledger-kernel = { workspace = true }
ledger-contracts = { workspace = true }
ledger-platform = { workspace = true }
ledger-testing = { workspace = true }
ledger-identity = { workspace = true }

# ── Tasks: `uv run poe <task>` ──────────────────────────────────────────────────
[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix .", help = "Format and autofix" }
format-check = { cmd = "ruff format --check .", help = "Verify formatting" }
lint = { cmd = "ruff check .", help = "Lint (every ruff rule enabled)" }
pyright = { cmd = "basedpyright", help = "Type check #1: basedpyright, mode 'all'" }
mypy-kernel = { cmd = "mypy libs/kernel" }
mypy-contracts = { cmd = "mypy libs/contracts" }
mypy-platform = { cmd = "mypy libs/platform" }
mypy-testing = { cmd = "mypy libs/testing" }
mypy-identity = { cmd = "mypy services/identity" }
mypy-workspace = { cmd = "mypy tests" }
mypy = { sequence = ["mypy-kernel", "mypy-contracts", "mypy-platform", "mypy-testing", "mypy-identity", "mypy-workspace"], help = "Type check #2, one package at a time (each has its own tests), then the workspace's own tests" }
types = { sequence = ["pyright", "mypy"], help = "Both type checkers" }
arch = { cmd = "lint-imports", help = "Architecture contracts (import-linter)" }
deps-kernel = { cmd = "deptry libs/kernel/src --config libs/kernel/pyproject.toml" }
deps-contracts = { cmd = "deptry libs/contracts/src --config libs/contracts/pyproject.toml" }
deps-platform = { cmd = "deptry libs/platform/src --config libs/platform/pyproject.toml" }
deps-testing = { cmd = "deptry libs/testing/src --config libs/testing/pyproject.toml" }
deps-identity = { cmd = "deptry services/identity/src --config services/identity/pyproject.toml" }
deps = { sequence = ["deps-kernel", "deps-contracts", "deps-platform", "deps-testing", "deps-identity"], help = "Unused / missing / transitive dependencies, per package" }
spell = { cmd = "typos", help = "Spell check" }
# Poe expands the `**` glob to absolute paths, and protoc only accepts a file that lies under a --proto_path
# spelled the same way: hence the absolute --proto_path. The *_out directories take no such comparison and
# stay relative to the project root, where poe runs every task. CI regenerates and diffs the committed code.
proto = { cmd = "python -m grpc_tools.protoc --proto_path=${POE_ROOT}/libs/contracts/proto --python_out=libs/contracts/src --mypy_out=libs/contracts/src --grpc_python_out=libs/contracts/src --mypy_grpc_out=libs/contracts/src libs/contracts/proto/ledger/**/*.proto", help = "Regenerate the code of every .proto" }
proto-lint = { cmd = "docker run --rm --volume ${POE_ROOT}/libs/contracts:/workspace --workdir /workspace bufbuild/buf:1.73.0 lint", help = "buf lint" }
test = { cmd = "pytest", help = "Tests with coverage" }
check = { sequence = ["format-check", "lint", "suppressions", "types", "arch", "deps", "spell", "proto-lint", "test"], help = "Everything CI runs" }

# Zero suppressions: no Python file outside the generated protobuf code may switch a check off.
# `git grep` runs once with one `-e` pattern per banned form (patterns are OR-ed, matched in any case), in
# this order:
#   1. `# noqa`                              ruff, one line
#   2. `# type: ignore`                      mypy and (base)pyright, one line
#   3. `# pyright:` / `# basedpyright:`      ignore, basic, strict, rule switches
#   4. `# flake8:` `# isort:` `# mypy:` `# ruff:`
#                                            whole-file forms (`# flake8: noqa`, `# ruff: noqa`,
#                                            `# mypy: ignore-errors`, `# isort: skip_file`) and ruff's
#                                            `# ruff: disable[...]` ranges
#   5. `# pragma: no cover` / `no branch`    coverage (also switched off in [tool.coverage.report])
# `git grep` exits 1 when nothing matches, so the task passes on exactly 1: a match (0) or a git failure (128)
# fails it. Untracked files are searched too, so a new file is checked before its first `git add`. Runs the
# same on Windows and Linux: no shell, no script. Prose that mentions a form without the `#` is not a match.
[tool.poe.tasks.suppressions]
help = "Zero suppressions: no noqa, type: ignore, tool directive or coverage pragma in Python files"
imports = ["subprocess"]
assert = true
expr = '''
subprocess.run([
    "git", "grep", "--untracked", "--exclude-standard", "--line-number", "--ignore-case", "--extended-regexp",
    "-e", "#[[:space:]]*noqa",
    "-e", "#[[:space:]]*type:[[:space:]]*ignore",
    "-e", "#[[:space:]]*(based)?pyright:",
    "-e", "#[[:space:]]*(flake8|isort|mypy|ruff):",
    "-e", "#[[:space:]]*pragma:?[[:space:]]*no[[:space:]]*(cover|branch)",
    "--", "*.py", "*.pyi", ":(exclude)libs/contracts/src/ledger",
]).returncode == 1
'''

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py315"
line-length = 110
extend-exclude = ["libs/contracts/src/ledger", "Tiltfile"]  # generated code; Starlark, not Python

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header
    "D105",    # magic methods are self-documenting
    "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"{libs/*/tests,services/*/tests,tests}/**" = [
    "S101",    # assert is the point of a test
    "D",       # test names are the documentation
    "PLR2004", # magic values are fine in assertions
    "S105",    # fake credentials are not secrets
    "S106",
    "S603",    # a test may run this interpreter on code of its own
    "INP001",  # tests are not a package: each package's tests/ is its own root
]
"conftest.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "ledger_platform.database.PlatformTable",  # SQLAlchemy reads the annotations of its tables at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["ledger_kernel", "ledger_contracts", "ledger_platform", "ledger_testing", "ledger_identity", "ledger"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]  # ruff 0.17 formats Python blocks inside Markdown; the docs show code as the plan wrote it

# ── Type checker #1: basedpyright ───────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.15"
include = ["libs", "services", "tests", "conftest.py"]
exclude = ["libs/contracts/src/ledger", "**/.venv", "**/__pycache__"]
typeCheckingMode = "all"
failOnWarnings = true
reportImplicitOverride = "error"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"

# ── Type checker #2: mypy --strict + every opt-in error code that applies ──────
[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
extra_checks = true
local_partial_types = true
strict_bytes = true
exclude = ["libs/contracts/src/ledger/"]
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = ["ledger.*"]
ignore_errors = true  # generated by protoc; its .pyi stubs still type every use

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Tests ───────────────────────────────────────────────────────────────────────
[tool.pytest]
minversion = "9.0"
testpaths = ["libs", "services", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["ledger_kernel", "ledger_contracts", "ledger_platform", "ledger_testing", "ledger_identity"]
core = "ctrace"

[tool.coverage.report]
fail_under = 100
exclude_lines = []     # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

# ── Architecture contracts (import-linter) ──────────────────────────────────────
[tool.importlinter]
root_packages = ["ledger_kernel", "ledger_contracts", "ledger_platform", "ledger_testing", "ledger_identity"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Production code never imports test tooling"
type = "forbidden"
source_modules = ["ledger_kernel", "ledger_contracts", "ledger_platform", "ledger_identity"]
forbidden_modules = ["pytest", "hypothesis", "testcontainers", "ledger_testing"]

[[tool.importlinter.contracts]]
name = "Packages point down: platform -> contracts -> kernel"
type = "layers"
layers = ["ledger_platform", "ledger_contracts", "ledger_kernel"]

# Inside the platform: the service assembles the adapters (HTTP, gRPC, consumers), which use messaging (the
# outbox, which declares streams again when they vanish, over the streams) and the idempotency keys, which use the
# infrastructure, which uses the foundations. Modules of one layer never import each other. The schema, which
# gathers the tables of the outbox, the consumers and the idempotency keys for migrations, sits below the service,
# whose readiness checks the tables exist.
# Exhaustive: a new module must be given its layer here.
[[tool.importlinter.contracts]]
name = "Platform layers: service -> adapters -> messaging -> infrastructure -> foundations"
type = "layers"
containers = ["ledger_platform"]
exhaustive = true
layers = [
    "service",
    "schema",
    "web | grpc_server | consumer | routes | identity_client",
    "outbox | idempotency | authorization",
    "streams",
    "database | tracing | health | logs | jetstream | authentication | request_fields | grpc_client",
    "settings | options | lifecycle | supervision | interruptions",
]

[[tool.importlinter.contracts]]
name = "Kernel is standard library only"
type = "forbidden"
source_modules = ["ledger_kernel"]
forbidden_modules = ["pydantic", "pydantic_settings", "sqlalchemy", "nats", "fastapi", "starlette", "structlog", "google", "grpc", "opentelemetry", "prometheus_client", "psycopg"]

[[tool.importlinter.contracts]]
name = "Contracts know the wire, not the infrastructure"
type = "forbidden"
source_modules = ["ledger_contracts"]
forbidden_modules = ["pydantic", "sqlalchemy", "nats", "fastapi", "starlette", "structlog", "opentelemetry", "prometheus_client", "psycopg"]

[[tool.importlinter.contracts]]
name = "Libraries never import services"
type = "forbidden"
source_modules = ["ledger_kernel", "ledger_contracts", "ledger_platform", "ledger_testing"]
forbidden_modules = ["ledger_identity"]

[[tool.importlinter.contracts]]
name = "Identity's domain is the standard library and the kernel"
type = "forbidden"
source_modules = ["ledger_identity.domain"]
forbidden_modules = [
    "ledger_contracts", "ledger_platform",
    # the kernel contract's list ...
    "pydantic", "pydantic_settings", "sqlalchemy", "nats", "fastapi", "starlette", "structlog", "google", "grpc",
    "opentelemetry", "prometheus_client", "psycopg",
    # ... and every other dependency the services of this repository bring in
    "httpx", "joserfc", "cryptography", "alembic", "granian",
]

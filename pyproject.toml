[project]
name = "ledger-workspace"
version = "0.0.0"
description = "Workspace root: the shared tooling of every ledger package. Packages are found by their manifests."
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "ledger-country-do-testing",
    "ledger-devtools",
    "ledger-testing",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "signxml>=5.1.0",
    "testcontainers>=4.15.0",
    "types-grpcio>=1.84.0.20260928",
    "types-lxml>=2026.2.16",
    "typos>=1.51.1",
    "vulture>=2.14",
    "xmlschema>=4.3.2",
]

[tool.uv]
required-version = ">=0.13.0"
package = false
constraint-dependencies = ["cryptography>=50.0.2"]  # joserfc's: the first release with CPython 3.15 wheels of its own

[tool.uv.workspace]
members = ["packages/*", "modules/*", "countries/*", "countries/*/testing", "apps/*", "tools/*"]

# Every distribution of the workspace (`ledger-devtools check` compares this table, the dev group's ledger-*
# entries and ruff's known-first-party with the manifests). A member's own pyproject names the sources it needs,
# but a member nested in another (countries/<cc>/testing) may not (Decision 27): the root's serve it. Install
# everything with `uv sync --all-packages`; the root itself depends on nothing.
[tool.uv.sources]
ledger-app-api = { workspace = true }
ledger-app-migrate = { workspace = true }
ledger-app-worker = { workspace = true }
ledger-country-do = { workspace = true }
ledger-country-do-testing = { workspace = true }
ledger-devtools = { workspace = true }
ledger-identity = { workspace = true }
ledger-kernel = { workspace = true }
ledger-platform = { workspace = true }
ledger-testing = { workspace = true }

# ── Tasks: `uv run poe <task>` ──────────────────────────────────────────────────
[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix .", help = "Format and autofix" }
format-check = { cmd = "ruff format --check .", help = "Verify formatting" }
lint = { cmd = "ruff check .", help = "Lint (every ruff rule enabled)" }
pyright = { cmd = "basedpyright", help = "Type check #1: basedpyright, mode 'all'" }
types = { sequence = ["pyright", "mypy"], help = "Both type checkers" }
arch = { cmd = "lint-imports", help = "Architecture contracts (import-linter, .importlinter is generated)" }
spell = { cmd = "typos", help = "Spell check" }
devtools = { cmd = "ledger-devtools check", help = "Manifests valid, generated files current, root lists and image pins" }
sync = { cmd = "ledger-devtools sync", help = "Write every file the manifests imply (pyprojects, _manifest.py, contracts, init.sql, OpenAPI)" }
check = { sequence = ["format-check", "lint", "suppressions", "types", "arch", "deps", "spell", "proto-lint", "devtools", "dead", "test"], help = "Everything CI runs" }

# The per-package loops run over every directory holding a manifest.toml (Decision 22): no list of packages lives
# here. A package's sources and tests are named, not its directory: countries/<cc> holds countries/<cc>/testing,
# a package of its own. `all([...])` builds the whole list first, so every package runs and reports even after
# one has failed.
[tool.poe.tasks.mypy]
help = "Type check #2: mypy --strict, one package at a time (each with its own tests)"
imports = ["glob", "os", "subprocess"]
assert = true
expr = """
all([subprocess.run(["mypy", f"{directory}/src", f"{directory}/tests"]).returncode == 0 for directory in sorted(
    os.path.dirname(path).replace(os.sep, "/")
    for path in glob.glob("*/*/manifest.toml") + glob.glob("countries/*/testing/manifest.toml")
)])
"""

[tool.poe.tasks.deps]
help = "Unused, missing and transitive dependencies (deptry), one package at a time"
imports = ["glob", "os", "subprocess"]
assert = true
expr = """
all([subprocess.run(["deptry", f"{directory}/src", "--config", f"{directory}/pyproject.toml"]).returncode == 0
    for directory in sorted(
        os.path.dirname(path).replace(os.sep, "/")
        for path in glob.glob("*/*/manifest.toml") + glob.glob("countries/*/testing/manifest.toml")
    )
])
"""

# Every package's tests at once, each run with its own coverage (its data file named after it), its output kept
# and printed whole, package by package, once all have finished. A package with an integration suite of four
# files or more spreads it over four workers (the packages share the machine); for the others, starting workers
# (and the PostgreSQL server xdist's controller starts for them) costs more than it saves.
[tool.poe.tasks.test]
help = "Each package's tests, all packages at once, each with its own 100 % branch coverage"
imports = ["glob", "os", "subprocess", "tempfile"]
assert = true
expr = """
(lambda started: all([
    (process.wait(), log.seek(0), print(f"=== {directory}", log.read().decode("utf-8", "replace"), sep="\\n"))[0] == 0
    for directory, log, process in started
]))([
    (directory, log, subprocess.Popen(
        [
            "pytest", f"{directory}/tests", "-c", "pyproject.toml", "-p", "no:cacheprovider",
            *(["-n", "4"] if len(glob.glob(f"{directory}/tests/integration/test_*.py")) >= 4 else []),
            "--cov", f"--cov-config={directory}/pyproject.toml", "--cov-report=term-missing:skip-covered",
        ],
        stdout=log, stderr=subprocess.STDOUT,
        env={**os.environ, "COVERAGE_FILE": f".coverage.{directory.replace('/', '-')}"},
    ))
    for directory, log in [(directory, tempfile.TemporaryFile()) for directory in sorted(
        os.path.dirname(path).replace(os.sep, "/")
        for path in glob.glob("*/*/manifest.toml") + glob.glob("countries/*/testing/manifest.toml")
    )]
])
"""

# Dead code in every package's sources. Each package's tests are scanned with them, as their users: the test
# tooling's helpers and the chassis API the spec asks for are used by tests (and by modules to come).
[tool.poe.tasks.dead]
help = "Dead code (vulture), over every package's sources and tests"
imports = ["glob", "subprocess"]
assert = true
expr = """
subprocess.run(["vulture", *sorted(
    glob.glob("*/*/src") + glob.glob("*/*/tests") + glob.glob("countries/*/testing/src")
    + glob.glob("countries/*/testing/tests")
)]).returncode == 0
"""

# buf lint over contracts/, in the image deploy/local/images.toml pins. Skipped while no .proto exists: the signer
# milestone adds the first (the only cross-process surface; in-process APIs are Python Protocols).
[tool.poe.tasks.proto-lint]
help = "buf lint over contracts/ (skipped while no .proto exists)"
imports = ["glob", "os", "pathlib", "subprocess", "tomllib"]
assert = true
expr = '''
not glob.glob("contracts/proto/**/*.proto", recursive=True) or subprocess.run([
    "docker", "run", "--rm", "--volume", f"{os.getcwd()}/contracts:/workspace", "--workdir", "/workspace",
    tomllib.loads(pathlib.Path("deploy/local/images.toml").read_text(encoding="utf-8"))["images"]["buf"], "lint",
]).returncode == 0
'''

# Zero suppressions: no Python file may switch a check off.
# `git grep` runs once with one `-e` pattern per banned form (patterns are OR-ed, matched in any case), in
# this order:
#   1. `# noqa`                              ruff, one line
#   2. `# type: ignore`                      mypy and (base)pyright, one line
#   3. `# pyright:` / `# basedpyright:`      ignore, basic, strict, rule switches
#   4. `# flake8:` `# isort:` `# mypy:` `# ruff:`
#                                            whole-file forms (`# flake8: noqa`, `# ruff: noqa`,
#                                            `# mypy: ignore-errors`, `# isort: skip_file`) and ruff's
#                                            `# ruff: disable[...]` ranges
#   5. `# pragma: no cover` / `no branch`    coverage (also switched off in [tool.coverage.report])
# `git grep` exits 1 when nothing matches, so the task passes on exactly 1: a match (0) or a git failure (128)
# fails it. Untracked files are searched too, so a new file is checked before its first `git add`. Runs the
# same on Windows and Linux: no shell, no script. Prose that mentions a form without the `#` is not a match.
[tool.poe.tasks.suppressions]
help = "Zero suppressions: no noqa, type: ignore, tool directive or coverage pragma in Python files"
imports = ["subprocess"]
assert = true
expr = '''
subprocess.run([
    "git", "grep", "--untracked", "--exclude-standard", "--line-number", "--ignore-case", "--extended-regexp",
    "-e", "#[[:space:]]*noqa",
    "-e", "#[[:space:]]*type:[[:space:]]*ignore",
    "-e", "#[[:space:]]*(based)?pyright:",
    "-e", "#[[:space:]]*(flake8|isort|mypy|ruff):",
    "-e", "#[[:space:]]*pragma:?[[:space:]]*no[[:space:]]*(cover|branch)",
    "--", "*.py", "*.pyi",
]).returncode == 1
'''

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py315"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header
    "D105",    # magic methods are self-documenting
    "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"{*/*/tests,countries/*/testing/tests}/**" = [
    "S101",    # assert is the point of a test
    "D",       # test names are the documentation
    "PLR2004", # magic values are fine in assertions
    "S105",    # fake credentials are not secrets
    "S106",
    "S603",    # a test may run this interpreter on code of its own
    "INP001",  # tests are not a package: each package's tests/ is its own root
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    # SQLAlchemy reads the annotations of its tables at runtime
    "ledger_identity.adapters.postgres.tables.IdentityTable",
]

[tool.ruff.lint.isort]
# The workspace's import packages: `ledger-devtools check` compares them with the manifests.
known-first-party = [
    "ledger_app_api", "ledger_app_migrate", "ledger_app_worker", "ledger_country_do", "ledger_country_do_testing",
    "ledger_devtools", "ledger_identity", "ledger_kernel", "ledger_platform", "ledger_testing",
]

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]  # ruff 0.17 formats Python blocks inside Markdown; the docs show code as the plan wrote it

# ── Type checker #1: basedpyright ───────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.15"
include = ["packages", "modules", "countries", "apps", "tools"]
exclude = ["**/.venv", "**/__pycache__"]
typeCheckingMode = "all"
failOnWarnings = true
reportImplicitOverride = "error"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"

# ── Type checker #2: mypy --strict + every opt-in error code that applies ──────
[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
extra_checks = true
local_partial_types = true
strict_bytes = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Tests ───────────────────────────────────────────────────────────────────────
# Run per package by `poe test` (coverage is each package's own: its generated pyproject.toml).
[tool.pytest]
minversion = "9.0"
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ── Dead code (vulture) ─────────────────────────────────────────────────────────
# A finding is dead code (delete it) or something a framework reads or calls by name or by registration; only
# patterns of the latter are listed, each with what reads it. No symbol of the repository is named here.
[tool.vulture]
min_confidence = 60
ignore_decorators = [
    # FastAPI calls the route and exception handlers registered by decorator
    "@*.get", "@*.post", "@*.put", "@*.patch", "@*.delete", "@*.exception_handler",
    # pydantic calls validators and serializers
    "@field_validator", "@model_validator", "@field_serializer", "@model_serializer",
    # pytest calls fixtures and hooks
    "@pytest.fixture", "@pytest.hookimpl", "@pytest.hookspec",
]
ignore_names = [
    "model_config",                 # pydantic reads a model's configuration by this name
    "settings_customise_sources",   # pydantic-settings calls this classmethod of a settings class
    "pytest_*",                     # pytest calls its hooks by name
    "down_revision", "branch_labels", "depends_on", "upgrade", "downgrade",  # Alembic: a revision's globals
    "exc_type", "exc_value", "traceback",  # the `__exit__`/`__aexit__` protocol's parameters; structlog's key
    "msg",                          # the key of a pydantic error (`ErrorDetails`) that a TypedDict reads by subscript
    "max_header_length",            # joserfc reads this attribute of its JWS registry
    "invocation_metadata",          # grpc's HandlerCallDetails attribute, which a test's stand-in must have
    "securitySchemes",              # OpenAPI's key, which a TypedDict of a test reads by subscript
    # signxml reads these attributes of its signer and verifier, and takes these keywords (typed by Protocols)
    "excise_empty_xmlns_declarations", "namespaces", "x509_cert", "expect_config",
]

[project]
name = "ledger-platform"
version = "0.1.0"
description = "The ledger chassis: settings, logs, health, HTTP, PostgreSQL and its migrations, events, jobs, tracing, gRPC, runtime composition."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "tzdata>=2025.2",
]

[project.scripts]
ledger-probe = "ledger_platform.observability.probe:main"

[tool.uv.sources]
ledger-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.deptry.package_module_name_map]
"opentelemetry-api" = "opentelemetry"
"opentelemetry-sdk" = "opentelemetry"
"opentelemetry-exporter-otlp-proto-grpc" = "opentelemetry"
"prometheus-client" = "prometheus_client"
"pydantic-settings" = "pydantic_settings"

[tool.deptry.per_rule_ignores]
DEP002 = ["tzdata"]  # the IANA database zoneinfo reads where the system has none (Windows); no module imports it

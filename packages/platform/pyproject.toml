# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-platform"
version = "0.1.0"
description = "The chassis: configuration, observability, data, events, jobs, runtime, HTTP, auth, gRPC."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "tzdata>=2025.2",
]

[project.scripts]
ledger-probe = "ledger_platform.observability.probe:main"

[tool.uv.sources]
ledger-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_platform"]
source = ["packages/platform/src/ledger_platform/data/revisions"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

[tool.deptry.package_module_name_map]
"grpcio" = "grpc"
"opentelemetry-api" = "opentelemetry"
"opentelemetry-exporter-otlp-proto-grpc" = "opentelemetry"
"opentelemetry-sdk" = "opentelemetry"
"prometheus-client" = "prometheus_client"
"pydantic-settings" = "pydantic_settings"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "tzdata",
]

[package]
name = "platform"
kind = "package"
summary = "The chassis: configuration, observability, data, events, jobs, runtime, HTTP, auth, gRPC."
owners = ["@balegre0"]
scripts = { "ledger-probe" = "ledger_platform.observability.probe:main" }

[dependencies]
packages = ["kernel"]
python = [
    "alembic>=1.20.0",
    "boto3>=1.43.100",
    "botocore>=1.43.100",
    "fastapi>=0.143.0",
    "granian[uvloop]>=2.8.4",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "types-boto3-s3>=1.43.100",
    "tzdata>=2025.2",
]
test = ["types-boto3>=1.43.100"]  # the stubs of boto3 and botocore (botocore-stubs) types-boto3-s3 names

[data]
schema = "platform"

[[ids]]
prefix = "evt"
resource = "event"

[[jobs]]
kind = "platform.purge_idempotency_keys"
concurrency = 1  # one purge at a time: a pass deletes every expired row

[[jobs]]
kind = "platform.purge_done_jobs"
concurrency = 1

[[schedules]]
name = "platform.purge_idempotency_keys"
every = "1h"
enqueues = "platform.purge_idempotency_keys"

[[schedules]]
name = "platform.purge_done_jobs"
every = "24h"
enqueues = "platform.purge_done_jobs"

[project]
name = "ledger-testing"
version = "0.1.0"
description = "What the tests of every ledger package share: real PostgreSQL and NATS, a local OpenID provider, the logging baseline, the schema a migration built."
requires-python = ">=3.15"
dependencies = [
    "ledger-kernel",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "testcontainers>=4.15.0",
]

[project.entry-points.pytest11]
ledger = "ledger_testing.plugin"

[tool.uv.sources]
ledger-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# GENERATED by ledger-devtools sync from manifest.toml: edit the manifest, then run `uv run ledger-devtools sync`.

[project]
name = "ledger-testing"
version = "0.1.0"
description = "The shared test harness: a pytest plugin, PostgreSQL, a local OpenID provider, clocks. Dev-only."
requires-python = ">=3.15"
dependencies = [
    "ledger-platform",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "testcontainers>=4.15.0",
]

[project.entry-points.pytest11]
ledger = "ledger_testing.plugin"

[tool.uv.sources]
ledger-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
core = "sysmon"
source_pkgs = ["ledger_testing"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = []  # no "pragma: no cover": every line counts
partial_branches = []  # no "pragma: no branch": every branch counts

[tool.deptry.package_module_name_map]
"pytest" = [
    "py",
    "pytest",
]
